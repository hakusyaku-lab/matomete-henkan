name: Build (Windows / Mac)

# 動き方
# - main へ push：テスト（Windows・Mac）。
#   さらに app/version.py のバージョンに対応するタグ（例 v0.4.0）がまだ無ければ、
#   Windows版・Mac版をビルドし、タグ付きで Releases に公開する。
#   → 新しい版を出すときは「version.py を上げて CHANGELOG を書いて main に push」するだけ。
# - pull request：テストのみ
# - Actions 画面から手動実行：テスト → ビルド（成果物は Actions の Artifacts に保存。公開はしない）
env:
  PYTHONIOENCODING: utf-8

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      - run: python -m playwright install chromium
      - run: python scripts/check.py

  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: v
        run: |
          VER=$(python3 -c "ns={}; exec(open('app/version.py').read(), ns); print(ns['__version__'])")
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ] \
             && ! git rev-parse -q --verify "refs/tags/v$VER" >/dev/null; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "v$VER はまだ公開されていないので、ビルドして公開します"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: [test, version]
    if: needs.version.outputs.release == 'true' || github.event_name == 'workflow_dispatch'
    strategy:
      matrix:
        include:
          - os: windows-latest
            label: windows
          - os: macos-latest
            label: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      - run: python build.py

      - name: Zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/MatometeHenkan -DestinationPath MatometeHenkan-windows.zip

      - name: Zip (Mac)
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent dist/MatometeHenkan.app MatometeHenkan-macos.zip

      - uses: actions/upload-artifact@v4
        with:
          name: MatometeHenkan-${{ matrix.label }}
          path: MatometeHenkan-${{ matrix.label }}.zip

  release:
    needs: [build, version]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: リリースノート（CHANGELOG.md の該当バージョン部分）
        run: |
          python3 - <<'PY'
          import re
          v = "${{ needs.version.outputs.version }}"
          text = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(r"^## \[" + re.escape(v) + r"\].*?\n(.*?)(?=^## \[|\Z)", text, re.S | re.M)
          body = (m.group(1).strip() if m else "") + "\n\n---\n使い方は README をご覧ください。"
          open("release_notes.md", "w", encoding="utf-8").write(body)
          PY
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: まとめて変換 v${{ needs.version.outputs.version }}
          body_path: release_notes.md
          files: |
            MatometeHenkan-windows.zip
            MatometeHenkan-macos.zip
